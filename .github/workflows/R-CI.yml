name: R-CI

on:
  push:
    branches: [ Andre ]
  pull_request:
    branches: [ Andre ]

defaults:
  run:
    working-directory: geoDBapi

jobs:
  R-CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.x'

      - name: Install dependencies
        run: |
          install.packages(c("remotes", "testthat", "httr", "tidygeocoder"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Run testthat tests
        run: R CMD check .
       