name: R-CI

on:
  push:
    branches: [ Scratch ]
  pull_request:
    branches: [ Scratch ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: R CMD check

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          R -e 'install.packages(c("devtools","roxygen2","testthat","usethis","httr","jsonlite","stringr","tidygeocoder","countrycode"))'

      - name: Document package
        run: R -e 'devtools::document()'

      - name: Install package
        run: R -e 'devtools::install()'

      - name: Run tests
        run: R -e 'devtools::test()'