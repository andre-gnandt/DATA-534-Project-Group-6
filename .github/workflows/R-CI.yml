name: R-CI

on:
  push:
    branches: [ Andre ]
  pull_request:
    branches: [ Andre ]

defaults:
  run:
    working-directory: ./geoDBapi

jobs:
  R-CI:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      # 3. Install package dependencies
      - name: Install dependencies
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = TRUE)

      # 4. Install testthat if not already installed
      - name: Install testthat
        run: Rscript -e 'if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat")'

      # 5. Run tests
      - name: Run tests
        run: Rscript -e 'library(testthat); test_dir("tests/testthat")'