name: R-CI

on:
  push:
    branches: [ Andre ]
  pull_request:
    branches: [ Andre ]

defaults:
  run:
    working-directory: ./geoDBapi

jobs:
  R-CI:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat # Ensure testthat is installed if not already a dependency
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          # Optional: specify arguments to R CMD check
          args: '--no-build-vignettes --no-manual'