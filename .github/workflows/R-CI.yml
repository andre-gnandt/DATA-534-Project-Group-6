name: R-CI

on:
  push:
    branches: [ Andre ]
  pull_request:
    branches: [ Andre ]

defaults:
  run:
    working-directory: geoDBapi 

jobs:
  R-CI-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            httr
            tidygeocoder
            testthat
            countrycode
            jsonlite
            stringr
          cache: true
          pak-args: --binary
      
      - name: Run tests
        run: R CMD check . --no-manual